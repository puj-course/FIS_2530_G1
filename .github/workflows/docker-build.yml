name: Build and Verify Docker Compose Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️ Configurar entorno Java 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️ Configurar Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️ Iniciar docker-compose (levanta los servicios)
      - name: Build and start services with Docker Compose
        run: |
          docker-compose -f scripts/backend/docker-compose.yml up -d --build

      # 5️ Verificar que el contenedor está corriendo
      - name: Verify container is running
        run: |
          docker ps
          docker logs $(docker ps -q --filter "name=bioprint-backend")

      # 6 Detener y limpiar los contenedores
      - name: Stop and clean up
        if: always()
        run: docker-compose -f scripts/backend/docker-compose.yml down
